<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="de-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="de-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="de-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#de-grad)" opacity="0.25" filter="url(#de-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#07122b" stroke="url(#de-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#de-glass)"/>
  <!-- Data Pipeline & Server Cylinder Nodes -->
  <ellipse cx="26" cy="22" rx="10" ry="4" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M16 22V36C16 38.2 20.5 40 26 40C31.5 40 36 38.2 36 36V22" stroke="#ffffff" stroke-width="1.8"/>
  <ellipse cx="26" cy="29" rx="10" ry="3.5" stroke="#00f2fe" stroke-width="1.2"/>
  <!-- Ingestion Pipe with Node Hub -->
  <path d="M36 29H44C46.2 29 48 30.8 48 33V42" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="42" r="3" fill="#00f2fe"/>
  <!-- ETL Arrow Pulse -->
  <path d="M22 47L26 43L30 47" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
