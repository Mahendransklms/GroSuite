<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dp-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="dp-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="dp-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#dp-grad)" opacity="0.25" filter="url(#dp-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#0d0e26" stroke="url(#dp-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#dp-glass)"/>
  <!-- Database Cylinder with Encryption Lock -->
  <ellipse cx="32" cy="20" rx="11" ry="4" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M21 20V32C21 34.2 25.9 36 32 36C38.1 36 43 34.2 43 32V20" stroke="#ffffff" stroke-width="1.8"/>
  <ellipse cx="32" cy="26" rx="11" ry="3.5" stroke="#00f2fe" stroke-width="1.2"/>
  <!-- Padlock Clasp & Body -->
  <rect x="27" y="36" width="10" height="9" rx="2" fill="#8b5cf6" stroke="#00f2fe" stroke-width="1.4"/>
  <path d="M29 36V33C29 31.3 30.3 30 32 30C33.7 30 35 31.3 35 33V36" stroke="#00f2fe" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="32" cy="40.5" r="1.2" fill="#ffffff"/>
</svg>
