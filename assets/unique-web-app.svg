<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071330"/>
      <stop offset="50%" stop-color="#040b1e"/>
      <stop offset="100%" stop-color="#02050f"/>
    </linearGradient>
    <linearGradient id="wa-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="wa-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wa-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="wa-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#00f2fe" flood-opacity="0.2"/>
    </filter>
    <filter id="wa-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glows -->
  <circle cx="440" cy="120" r="100" fill="#00f2fe" opacity="0.18" filter="url(#wa-glow)"/>
  <circle cx="100" cy="280" r="90" fill="#2a6df4" opacity="0.2" filter="url(#wa-glow)"/>
  <circle cx="270" cy="180" r="80" fill="#10b981" opacity="0.12" filter="url(#wa-glow)"/>

  <!-- Main Web App Cloud Platform Window -->
  <g filter="url(#wa-shadow)">
    <!-- Main Window Canvas -->
    <rect x="35" y="30" width="470" height="280" rx="18" fill="url(#wa-bg)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <rect x="35" y="30" width="470" height="280" rx="18" fill="url(#wa-glass)"/>

    <!-- App Header Bar -->
    <path d="M35 48C35 38.0589 43.0589 30 53 30H487C496.941 30 505 38.0589 505 48V64H35V48Z" fill="rgba(255,255,255,0.04)" stroke="rgba(0,242,254,0.15)" stroke-width="1"/>
    <!-- Controls -->
    <circle cx="56" cy="47" r="4.5" fill="#ef4444"/>
    <circle cx="72" cy="47" r="4.5" fill="#f59e0b"/>
    <circle cx="88" cy="47" r="4.5" fill="#10b981"/>

    <!-- App System Status Badge -->
    <g transform="translate(112, 40)">
      <rect x="0" y="0" width="130" height="15" rx="7.5" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="0.8"/>
      <circle cx="10" cy="7.5" r="3" fill="#10b981"/>
      <text x="20" y="11" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8" font-weight="700">API Gateway: Online</text>
    </g>

    <!-- Sidebar Navigation Simulation -->
    <rect x="35" y="65" width="55" height="245" fill="rgba(2,6,23,0.6)"/>
    <rect x="47" y="80" width="31" height="6" rx="3" fill="#00f2fe" opacity="0.9"/>
    <rect x="47" y="100" width="31" height="5" rx="2.5" fill="#475569"/>
    <rect x="47" y="118" width="31" height="5" rx="2.5" fill="#475569"/>
    <rect x="47" y="136" width="31" height="5" rx="2.5" fill="#475569"/>
    <rect x="47" y="154" width="31" height="5" rx="2.5" fill="#475569"/>
    <circle cx="62" cy="275" r="12" fill="rgba(112,166,255,0.2)"/>

    <!-- Main Dashboard Metrics Area -->
    <!-- Metric 1: Real-time Users -->
    <g transform="translate(105, 80)">
      <rect x="0" y="0" width="120" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(112,166,255,0.2)" stroke-width="1"/>
      <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Active Workflows</text>
      <text x="12" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">14,892</text>
      <rect x="12" y="52" width="60" height="3" rx="1.5" fill="url(#wa-cyan)"/>
      <text x="78" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">+28.4%</text>
    </g>

    <!-- Metric 2: Uptime & SLA -->
    <g transform="translate(235, 80)">
      <rect x="0" y="0" width="120" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
      <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Global Cluster SLA</text>
      <text x="12" y="42" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="800">99.98%</text>
      <rect x="12" y="52" width="90" height="3" rx="1.5" fill="#10b981"/>
    </g>

    <!-- Metric 3: Response Latency -->
    <g transform="translate(365, 80)">
      <rect x="0" y="0" width="120" height="65" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(112,166,255,0.2)" stroke-width="1"/>
      <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">P99 Latency</text>
      <text x="12" y="42" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="18" font-weight="800">42ms</text>
      <rect x="12" y="52" width="50" height="3" rx="1.5" fill="url(#wa-cyan)"/>
    </g>

    <!-- Interactive Data Chart Area -->
    <g transform="translate(105, 160)">
      <rect x="0" y="0" width="220" height="135" rx="12" fill="rgba(4,11,30,0.85)" stroke="rgba(112,166,255,0.2)" stroke-width="1"/>
      <text x="14" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Real-Time Data Streaming</text>
      <!-- Grid lines -->
      <line x1="14" y1="45" x2="206" y2="45" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <line x1="14" y1="75" x2="206" y2="75" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <line x1="14" y1="105" x2="206" y2="105" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <!-- Glowing Chart Curves -->
      <path d="M14 95 Q 40 70, 70 85 T 130 55 T 170 70 T 206 40" fill="none" stroke="url(#wa-cyan)" stroke-width="3" stroke-linecap="round"/>
      <path d="M14 95 Q 40 70, 70 85 T 130 55 T 170 70 T 206 40 V 125 H 14 Z" fill="url(#wa-cyan)" opacity="0.12"/>
      <circle cx="130" cy="55" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="206" cy="40" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Floating Live Terminal / Code Panel -->
    <g transform="translate(338, 160)">
      <rect x="0" y="0" width="147" height="135" rx="12" fill="#020817" stroke="rgba(0,242,254,0.35)" stroke-width="1.2"/>
      <rect x="0" y="0" width="147" height="20" rx="12" fill="rgba(255,255,255,0.04)"/>
      <circle cx="10" cy="10" r="2.5" fill="#ef4444"/>
      <circle cx="18" cy="10" r="2.5" fill="#f59e0b"/>
      <circle cx="26" cy="10" r="2.5" fill="#10b981"/>
      <text x="40" y="13" fill="#64748b" font-family="monospace" font-size="7.5">api-server.ts</text>
      <!-- Code lines -->
      <text x="10" y="36" fill="#38bdf8" font-family="monospace" font-size="8">const app = express();</text>
      <text x="10" y="50" fill="#a855f7" font-family="monospace" font-size="8">app.use(authMiddleware)</text>
      <text x="10" y="64" fill="#34d399" font-family="monospace" font-size="8">// GraphQL Query</text>
      <text x="10" y="78" fill="#f1f5f9" font-family="monospace" font-size="8">query: GetAnalytics</text>
      <text x="10" y="92" fill="#fbbf24" font-family="monospace" font-size="8">status: 200 OK</text>
      <text x="10" y="106" fill="#00f2fe" font-family="monospace" font-size="8">latency: 18ms</text>
      <rect x="10" y="118" width="5" height="10" fill="#00f2fe"/>
    </g>
  </g>

  <!-- Floating Microservice Node Badges -->
  <g transform="translate(15, 20)" filter="url(#wa-shadow)">
    <rect x="0" y="0" width="130" height="38" rx="12" fill="#0b1a3d" stroke="rgba(0,242,254,0.5)" stroke-width="1.2"/>
    <circle cx="18" cy="19" r="8" fill="rgba(0,242,254,0.2)"/>
    <circle cx="18" cy="19" r="3.5" fill="#00f2fe"/>
    <text x="32" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Microservices</text>
    <text x="32" y="27" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600">Docker &amp; K8s</text>
  </g>

  <g transform="translate(385, 320)" filter="url(#wa-shadow)">
    <rect x="0" y="0" width="135" height="38" rx="12" fill="#061c24" stroke="rgba(16,185,129,0.5)" stroke-width="1.2"/>
    <circle cx="18" cy="19" r="8" fill="rgba(16,185,129,0.2)"/>
    <path d="M14 19L17 22L22 17" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Zero-Trust RBAC</text>
    <text x="32" y="27" fill="#34d399" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600">Enterprise Secure</text>
  </g>
</svg>
