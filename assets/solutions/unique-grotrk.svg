<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="trk-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="50%" stop-color="#06101d"/>
      <stop offset="100%" stop-color="#020509"/>
    </linearGradient>
    <filter id="trk-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="160" cy="120" r="100" fill="#0284c7" opacity="0.2"/>
  <circle cx="420" cy="240" r="110" fill="#10b981" opacity="0.18"/>

  <g filter="url(#trk-shadow)">
    <!-- Container -->
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#trk-bg)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>

    <!-- Header -->
    <path d="M35 46C35 37.1634 42.1634 30 51 30H489C497.837 30 505 37.1634 505 46V62H35V46Z" fill="rgba(255,255,255,0.04)" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
    <circle cx="56" cy="46" r="4" fill="#ef4444"/>
    <circle cx="70" cy="46" r="4" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="4" fill="#10b981"/>
    <text x="120" y="49" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8" font-weight="600">Grotrk · Live GPS Tracking &amp; Fleet Telematics</text>

    <!-- Map Simulation Grid -->
    <rect x="55" y="75" width="280" height="235" rx="10" fill="rgba(2,132,199,0.05)" stroke="rgba(56,189,248,0.2)"/>
    <!-- Grid Roads -->
    <path d="M55 130 H335 M55 190 H335 M55 250 H335 M120 75 V310 M200 75 V310 M280 75 V310" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- GPS Trajectory Line -->
    <path d="M75 270 Q140 240 180 180 T260 120" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>

    <!-- Start Pin -->
    <circle cx="75" cy="270" r="6" fill="#10b981"/>
    <circle cx="75" cy="270" r="12" stroke="#10b981" stroke-width="1.5" opacity="0.5" fill="none"/>

    <!-- Active Vehicle Marker -->
    <circle cx="260" cy="120" r="10" fill="#38bdf8"/>
    <circle cx="260" cy="120" r="18" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" fill="none"/>
    <polygon points="260,115 264,124 260,121 256,124" fill="#ffffff"/>

    <!-- Geofence Zone Circle -->
    <circle cx="200" cy="190" r="45" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="165" y="193" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="8" font-weight="700">GEOFENCE 01</text>

    <!-- Right Side Telematics Panel -->
    <rect x="345" y="75" width="145" height="110" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="358" y="93" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">Fleet Telematics</text>
    <text x="358" y="112" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">VEHICLE SPEED</text>
    <text x="358" y="132" fill="#38bdf8" font-family="'Manrope', sans-serif" font-size="16" font-weight="800">58 km/h</text>
    <text x="358" y="152" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">STATUS</text>
    <text x="358" y="170" fill="#10b981" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">● Moving · On-Route</text>

    <rect x="345" y="195" width="145" height="115" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="358" y="213" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">Asset Summary</text>
    <text x="358" y="233" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Active Assets: <tspan fill="#ffffff" font-weight="700">42</tspan></text>
    <text x="358" y="252" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Idle Assets: <tspan fill="#ffffff" font-weight="700">4</tspan></text>
    <text x="358" y="271" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Overspeed Alerts: <tspan fill="#ef4444" font-weight="700">0</tspan></text>
    <text x="358" y="290" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">GPS Signal: <tspan fill="#10b981" font-weight="700">100%</tspan></text>
  </g>
</svg>