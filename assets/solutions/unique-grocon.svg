    <text x="68" y="117" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">76.4% Done</text>

    <rect x="200" y="75" width="135" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(37,99,235,0.3)"/>
