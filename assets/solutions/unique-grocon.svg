      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <filter id="con-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
