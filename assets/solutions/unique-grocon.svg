    <text x="366" y="270" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="8" font-weight="700">RA BILL #04</text>
    <text x="366" y="284" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">₹4,85,000 Verified</text>
