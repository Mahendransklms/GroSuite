<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="hrms-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1332"/>
      <stop offset="50%" stop-color="#070c20"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>
    <linearGradient id="hrms-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hrms-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="hrms-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="hrms-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="120" cy="110" r="90" fill="#2563eb" opacity="0.22"/>
  <circle cx="420" cy="260" r="100" fill="#10b981" opacity="0.18"/>

  <g filter="url(#hrms-shadow)">
    <!-- Dashboard Window -->
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#hrms-bg)" stroke="rgba(112, 166, 255, 0.35)" stroke-width="1.5"/>
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#hrms-glass)"/>

    <!-- Window Header -->
    <path d="M35 46C35 37.1634 42.1634 30 51 30H489C497.837 30 505 37.1634 505 46V62H35V46Z" fill="rgba(255,255,255,0.04)" stroke="rgba(112,166,255,0.15)" stroke-width="1"/>
    <circle cx="56" cy="46" r="4" fill="#ef4444"/>
    <circle cx="70" cy="46" r="4" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="4" fill="#10b981"/>
    <rect x="110" y="40" width="160" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="120" y="49" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8" font-weight="600">Grohrms · Enterprise HRMS</text>

    <!-- Stat Card 1: Active Workforce -->
    <rect x="55" y="75" width="125" height="65" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(112,166,255,0.2)"/>
    <text x="68" y="94" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="10" font-weight="600">TOTAL WORKFORCE</text>
    <text x="68" y="122" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="22" font-weight="800">1,250</text>
    <rect x="135" y="105" width="35" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="140" y="117" fill="#34d399" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">+12.4%</text>

    <!-- Stat Card 2: Attendance Today -->
    <rect x="195" y="75" width="135" height="65" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.3)"/>
    <text x="208" y="94" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="10" font-weight="600">TODAY'S ATTENDANCE</text>
    <text x="208" y="122" fill="#34d399" font-family="'Manrope', sans-serif" font-size="22" font-weight="800">98.2%</text>
    <circle cx="305" cy="107" r="14" stroke="rgba(255,255,255,0.1)" stroke-width="3" fill="none"/>
    <circle cx="305" cy="107" r="14" stroke="#10b981" stroke-width="3" stroke-dasharray="75 25" fill="none" stroke-linecap="round"/>

    <!-- Stat Card 3: Biometric GPS Sync -->
    <rect x="345" y="75" width="145" height="65" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(112,166,255,0.2)"/>
    <text x="358" y="94" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="10" font-weight="600">BIOMETRIC SYNC</text>
    <text x="358" y="120" fill="#38bdf8" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Live Active</text>
    <circle cx="465" cy="115" r="4" fill="#10b981"/>

    <!-- Payroll & Shift Chart Section -->
    <rect x="55" y="152" width="275" height="155" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(112,166,255,0.15)"/>
    <text x="70" y="174" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="12" font-weight="700">Monthly Payroll &amp; Compliance</text>

    <!-- Bars for Payroll -->
    <g transform="translate(70, 190)">
      <rect x="0" y="45" width="18" height="50" rx="3" fill="url(#hrms-cyan)"/>
      <rect x="30" y="30" width="18" height="65" rx="3" fill="url(#hrms-cyan)"/>
      <rect x="60" y="20" width="18" height="75" rx="3" fill="url(#hrms-cyan)"/>
      <rect x="90" y="35" width="18" height="60" rx="3" fill="url(#hrms-cyan)"/>
      <rect x="120" y="10" width="18" height="85" rx="3" fill="url(#hrms-cyan)"/>
      <rect x="150" y="25" width="18" height="70" rx="3" fill="url(#hrms-cyan)"/>
      <rect x="180" y="5" width="18" height="90" rx="3" fill="url(#hrms-green)"/>
      <path d="M9 40 L39 25 L69 15 L99 30 L129 5 L159 20 L189 0" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Right Column: Employee Self-Service Mobile Card -->
    <rect x="345" y="152" width="145" height="155" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(112,166,255,0.2)"/>
    <text x="358" y="174" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">Mobile ESS App</text>
    <rect x="358" y="188" width="118" height="28" rx="6" fill="rgba(37,99,235,0.15)" stroke="rgba(37,99,235,0.3)"/>
    <circle cx="372" cy="202" r="7" fill="#2563eb"/>
    <text x="385" y="199" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">Quick Punch In</text>
    <text x="385" y="209" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">08:58 AM · GPS Verified</text>

    <rect x="358" y="224" width="118" height="24" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="368" y="239" fill="#cbd5e1" font-family="'Manrope', sans-serif" font-size="9">Leave Approved</text>

    <rect x="358" y="255" width="118" height="24" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="368" y="270" fill="#cbd5e1" font-family="'Manrope', sans-serif" font-size="9">Payslip Ready (PDF)</text>
  </g>
</svg>