<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="hub-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="50%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <filter id="hub-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="150" cy="110" r="90" fill="#10b981" opacity="0.22"/>
  <circle cx="410" cy="250" r="100" fill="#3b82f6" opacity="0.18"/>

  <g filter="url(#hub-shadow)">
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#hub-bg)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>

    <path d="M35 46C35 37.1634 42.1634 30 51 30H489C497.837 30 505 37.1634 505 46V62H35V46Z" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
    <circle cx="56" cy="46" r="4" fill="#ef4444"/>
    <circle cx="70" cy="46" r="4" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="4" fill="#10b981"/>
    <text x="120" y="49" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8" font-weight="600">Grohub · Automated Parking Management &amp; ANPR</text>

    <!-- Top Parking Slots KPI -->
    <rect x="55" y="75" width="135" height="55" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.3)"/>
    <text x="68" y="93" fill="#10b981" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">AVAILABLE SLOTS</text>
    <text x="68" y="117" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">142 Free</text>

    <rect x="200" y="75" width="135" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(59,130,246,0.3)"/>
    <text x="213" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">TOTAL CAPACITY</text>
    <text x="213" y="117" fill="#38bdf8" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">450 Bays</text>

    <rect x="345" y="75" width="140" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(245,158,11,0.3)"/>
    <text x="358" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">FASTAG COLLECT</text>
    <text x="358" y="117" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">₹38,200</text>

    <!-- ANPR Boom Barrier Gate Live Feed -->
    <rect x="55" y="142" width="270" height="168" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(16,185,129,0.2)"/>
    <text x="70" y="164" fill="#34d399" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">ANPR Entry Gate #01</text>

    <!-- Vehicle License Plate Simulator -->
    <rect x="70" y="180" width="240" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
    <rect x="80" y="190" width="140" height="30" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="92" y="210" fill="#000000" font-family="'Courier New', monospace" font-size="15" font-weight="900">TN 09 BX 4291</text>
    <circle cx="285" cy="205" r="8" fill="#10b981"/>
    <text x="270" y="228" fill="#10b981" font-family="'Manrope', sans-serif" font-size="8" font-weight="700">Barrier Open</text>

    <text x="70" y="255" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Vehicle Class: <tspan fill="#ffffff" font-weight="700">Commercial SUV</tspan></text>
    <text x="70" y="272" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Assigned Bay: <tspan fill="#38bdf8" font-weight="700">Floor 2 · Bay B-14</tspan></text>
    <text x="70" y="290" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">FASTag Auth: <tspan fill="#10b981" font-weight="700">Auto-Debit Enabled</tspan></text>

    <!-- Right Side: Level Floor Counter -->
    <rect x="335" y="142" width="150" height="168" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="348" y="164" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">Floor Occupancy</text>

    <g transform="translate(348, 180)">
      <text x="0" y="12" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Basement 1:</text>
      <text x="80" y="12" fill="#10b981" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">42 Free</text>

      <text x="0" y="36" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Ground Floor:</text>
      <text x="80" y="36" fill="#ef4444" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">Full (0)</text>

      <text x="0" y="60" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Level 2 (VIP):</text>
      <text x="80" y="60" fill="#10b981" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">18 Free</text>

      <text x="0" y="84" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Rooftop Deck:</text>
      <text x="80" y="84" fill="#10b981" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">82 Free</text>
    </g>
  </g>
</svg>