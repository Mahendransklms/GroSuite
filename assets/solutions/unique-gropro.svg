<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="pro-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0f20"/>
      <stop offset="50%" stop-color="#120914"/>
      <stop offset="100%" stop-color="#070308"/>
    </linearGradient>
    <linearGradient id="pro-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="pro-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="150" cy="110" r="90" fill="#ec4899" opacity="0.2"/>
  <circle cx="410" cy="250" r="100" fill="#8b5cf6" opacity="0.18"/>

  <g filter="url(#pro-shadow)">
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#pro-bg)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.5"/>

    <path d="M35 46C35 37.1634 42.1634 30 51 30H489C497.837 30 505 37.1634 505 46V62H35V46Z" fill="rgba(255,255,255,0.04)" stroke="rgba(236,72,153,0.15)" stroke-width="1"/>
    <circle cx="56" cy="46" r="4" fill="#ef4444"/>
    <circle cx="70" cy="46" r="4" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="4" fill="#10b981"/>
    <text x="120" y="49" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8" font-weight="600">Gropro · Textile &amp; Apparel POS Retail ERP</text>

    <!-- Top KPIs -->
    <rect x="55" y="75" width="135" height="55" rx="8" fill="rgba(236,72,153,0.06)" stroke="rgba(236,72,153,0.3)"/>
    <text x="68" y="93" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">TODAY'S BILLING</text>
    <text x="68" y="117" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">₹1,84,250</text>

    <rect x="200" y="75" width="135" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(139,92,246,0.3)"/>
    <text x="213" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">BARCODE SCANS</text>
    <text x="213" y="117" fill="#a78bfa" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">420 Items</text>

    <rect x="345" y="75" width="140" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.3)"/>
    <text x="358" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">MULTI-STORE SYNC</text>
    <text x="358" y="117" fill="#10b981" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">4 Branches</text>

    <!-- Left: High-speed POS Billing Simulator -->
    <rect x="55" y="142" width="275" height="168" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(236,72,153,0.2)"/>
    <text x="70" y="164" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">Quick Barcode Invoice #INV-9214</text>

    <g transform="translate(70, 180)">
      <text x="0" y="10" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">Silk Saree (Pure Kanchipuram)</text>
      <text x="180" y="10" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">₹14,500</text>
      <text x="0" y="22" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">Barcode: #8902148 · Color: Crimson Red</text>

      <text x="0" y="44" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">Cotton Shirting Roll (32 Meters)</text>
      <text x="180" y="44" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">₹4,800</text>
      <text x="0" y="56" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">Barcode: #7741209 · Fabric: 100% Linen</text>

      <line x1="0" y1="70" x2="245" y2="70" stroke="rgba(255,255,255,0.1)"/>

      <text x="0" y="88" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Subtotal:</text>
      <text x="180" y="88" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9">₹19,300</text>
      <text x="0" y="104" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Festival Discount (10%):</text>
      <text x="180" y="104" fill="#10b981" font-family="'Manrope', sans-serif" font-size="9">- ₹1,930</text>

      <text x="0" y="122" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="10" font-weight="800">Final Net Bill:</text>
      <text x="180" y="122" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="11" font-weight="800">₹17,370</text>
    </g>

    <!-- Right: Matrix Sizing & Roll Meters -->
    <rect x="340" y="142" width="145" height="168" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="352" y="164" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">Matrix Stock</text>

    <!-- Sizing Matrix Badges -->
    <g transform="translate(352, 178)">
      <rect x="0" y="0" width="28" height="24" rx="4" fill="rgba(255,255,255,0.08)"/>
      <text x="9" y="16" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">S</text>
      <rect x="34" y="0" width="28" height="24" rx="4" fill="rgba(255,255,255,0.08)"/>
      <text x="41" y="16" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">M</text>
      <rect x="68" y="0" width="28" height="24" rx="4" fill="rgba(236,72,153,0.3)"/>
      <text x="77" y="16" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">L</text>
      <rect x="102" y="0" width="28" height="24" rx="4" fill="rgba(255,255,255,0.08)"/>
      <text x="108" y="16" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">XL</text>

      <text x="0" y="44" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">FABRIC ROLL METERS:</text>
      <text x="0" y="58" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">1,420 Meters In-Stock</text>

      <text x="0" y="78" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">BRANCH TRANSFERS:</text>
      <text x="0" y="92" fill="#10b981" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">● 50 pcs sent to Store 2</text>
    </g>
  </g>
</svg>