<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="log-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071228"/>
      <stop offset="50%" stop-color="#050d1e"/>
      <stop offset="100%" stop-color="#02050c"/>
    </linearGradient>
    <linearGradient id="log-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="log-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="150" cy="100" r="100" fill="#06b6d4" opacity="0.2"/>
  <circle cx="400" cy="270" r="110" fill="#3b82f6" opacity="0.18"/>

  <g filter="url(#log-shadow)">
    <!-- Main Window -->
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#log-bg)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M35 46C35 37.1634 42.1634 30 51 30H489C497.837 30 505 37.1634 505 46V62H35V46Z" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
    <circle cx="56" cy="46" r="4" fill="#ef4444"/>
    <circle cx="70" cy="46" r="4" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="4" fill="#10b981"/>
    <text x="120" y="49" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8" font-weight="600">Grolog · Call Log Management &amp; AI Analytics</text>

    <!-- Top Call Stats -->
    <rect x="55" y="75" width="95" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.2)"/>
    <text x="67" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">TOTAL CALLS</text>
    <text x="67" y="117" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">1,256</text>

    <rect x="160" y="75" width="95" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.3)"/>
    <text x="172" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">ANSWERED</text>
    <text x="172" y="117" fill="#10b981" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">986</text>

    <rect x="265" y="75" width="95" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(239,68,68,0.3)"/>
    <text x="277" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">MISSED</text>
    <text x="277" y="117" fill="#ef4444" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">182</text>

    <rect x="370" y="75" width="115" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(245,158,11,0.3)"/>
    <text x="382" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">FOLLOW-UPS</text>
    <text x="382" y="117" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="18" font-weight="800">68 Due</text>

    <!-- Audio Waveform Call Player -->
    <rect x="55" y="142" width="430" height="60" rx="10" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.3)"/>
    <circle cx="85" cy="172" r="14" fill="#06b6d4"/>
    <polygon points="82,166 91,172 82,178" fill="#ffffff"/>
    <text x="110" y="166" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">+91 99423 55939 · Inbound Call</text>
    <text x="110" y="180" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Duration: 04:32 mins · Agent: John D. · SIM 1 Sync</text>

    <!-- Waveform Graphic -->
    <g transform="translate(320, 160)" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="12" x2="0" y2="12"/>
      <line x1="8" y1="6" x2="8" y2="18"/>
      <line x1="16" y1="2" x2="16" y2="22"/>
      <line x1="24" y1="8" x2="24" y2="16"/>
      <line x1="32" y1="0" x2="32" y2="24"/>
      <line x1="40" y1="5" x2="40" y2="19"/>
      <line x1="48" y1="10" x2="48" y2="14"/>
      <line x1="56" y1="3" x2="56" y2="21"/>
      <line x1="64" y1="7" x2="64" y2="17"/>
      <line x1="72" y1="11" x2="72" y2="13"/>
      <line x1="80" y1="4" x2="80" y2="20"/>
      <line x1="88" y1="9" x2="88" y2="15"/>
      <line x1="96" y1="2" x2="96" y2="22"/>
      <line x1="104" y1="6" x2="104" y2="18"/>
      <line x1="112" y1="12" x2="112" y2="12"/>
      <line x1="120" y1="4" x2="120" y2="20"/>
      <line x1="128" y1="8" x2="128" y2="16"/>
      <line x1="136" y1="11" x2="136" y2="13"/>
      <line x1="144" y1="12" x2="144" y2="12"/>
    </g>

    <!-- Bottom Left: AI Summary Card -->
    <rect x="55" y="214" width="250" height="98" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="68" y="232" fill="#38bdf8" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">✦ AI CALL SUMMARY</text>
    <text x="68" y="248" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">Client requested quotation for 50-user license.</text>
    <text x="68" y="262" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">Follow-up scheduled for Monday 11:00 AM.</text>
    <rect x="68" y="274" width="80" height="20" rx="4" fill="rgba(56,189,248,0.2)"/>
    <text x="76" y="287" fill="#38bdf8" font-family="'Manrope', sans-serif" font-size="8" font-weight="700">Lead Score: High</text>

    <!-- Bottom Right: Live SIM Channels -->
    <rect x="315" y="214" width="170" height="98" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="328" y="232" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">Company SIM Sync</text>
    <circle cx="334" cy="249" r="4" fill="#10b981"/>
    <text x="344" y="252" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">SIM 1 · Sales Dept (Connected)</text>
    <circle cx="334" cy="269" r="4" fill="#10b981"/>
    <text x="344" y="272" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">SIM 2 · Support Team (Active)</text>
    <circle cx="334" cy="289" r="4" fill="#38bdf8"/>
    <text x="344" y="292" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">SIM 3 · Field Ops (Auto-Sync)</text>
  </g>
</svg>