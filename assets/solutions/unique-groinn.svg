<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="inn-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140f24"/>
      <stop offset="50%" stop-color="#0d0a18"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <filter id="inn-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="150" cy="110" r="90" fill="#f59e0b" opacity="0.2"/>
  <circle cx="420" cy="250" r="100" fill="#8b5cf6" opacity="0.18"/>

  <g filter="url(#inn-shadow)">
    <rect x="35" y="30" width="470" height="300" rx="16" fill="url(#inn-bg)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5"/>

    <!-- Header -->
    <path d="M35 46C35 37.1634 42.1634 30 51 30H489C497.837 30 505 37.1634 505 46V62H35V46Z" fill="rgba(255,255,255,0.04)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
    <circle cx="56" cy="46" r="4" fill="#ef4444"/>
    <circle cx="70" cy="46" r="4" fill="#f59e0b"/>
    <circle cx="84" cy="46" r="4" fill="#10b981"/>
    <text x="120" y="49" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8" font-weight="600">Groinn · Hotel &amp; Restaurant Operations</text>

    <!-- Top KPI Cards -->
    <rect x="55" y="75" width="135" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(245,158,11,0.3)"/>
    <text x="68" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">OCCUPANCY RATE</text>
    <text x="68" y="117" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">88.5%</text>

    <rect x="200" y="75" width="135" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(16,185,129,0.3)"/>
    <text x="213" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">ROOMS OCCUPIED</text>
    <text x="213" y="117" fill="#10b981" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">42 / 48</text>

    <rect x="345" y="75" width="140" height="55" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(139,92,246,0.3)"/>
    <text x="358" y="93" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9" font-weight="600">RESTAURANT KOT</text>
    <text x="358" y="117" fill="#a78bfa" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">18 Active</text>

    <!-- Room Status Matrix Grid -->
    <rect x="55" y="142" width="275" height="168" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="70" y="162" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">Live Room Availability</text>

    <!-- Matrix Rows -->
    <g transform="translate(70, 175)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="45" height="32" rx="4" fill="#10b981" opacity="0.8"/>
      <text x="12" y="20" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">101</text>
      <rect x="52" y="0" width="45" height="32" rx="4" fill="#ef4444" opacity="0.8"/>
      <text x="64" y="20" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">102</text>
      <rect x="104" y="0" width="45" height="32" rx="4" fill="#10b981" opacity="0.8"/>
      <text x="116" y="20" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">103</text>
      <rect x="156" y="0" width="45" height="32" rx="4" fill="#f59e0b" opacity="0.8"/>
      <text x="168" y="20" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">104</text>
      <rect x="208" y="0" width="45" height="32" rx="4" fill="#10b981" opacity="0.8"/>
      <text x="220" y="20" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">105</text>

      <!-- Row 2 -->
      <rect x="0" y="38" width="45" height="32" rx="4" fill="#ef4444" opacity="0.8"/>
      <text x="12" y="58" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">201</text>
      <rect x="52" y="38" width="45" height="32" rx="4" fill="#ef4444" opacity="0.8"/>
      <text x="64" y="58" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">202</text>
      <rect x="104" y="38" width="45" height="32" rx="4" fill="#10b981" opacity="0.8"/>
      <text x="116" y="58" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">203</text>
      <rect x="156" y="38" width="45" height="32" rx="4" fill="#10b981" opacity="0.8"/>
      <text x="168" y="58" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">204</text>
      <rect x="208" y="38" width="45" height="32" rx="4" fill="#f59e0b" opacity="0.8"/>
      <text x="220" y="58" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">205</text>

      <!-- Legend -->
      <circle cx="5" cy="98" r="4" fill="#10b981"/>
      <text x="14" y="101" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">Vacant</text>
      <circle cx="65" cy="98" r="4" fill="#ef4444"/>
      <text x="74" y="101" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">Occupied</text>
      <circle cx="130" cy="98" r="4" fill="#f59e0b"/>
      <text x="139" y="101" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="8">Cleaning</text>
    </g>

    <!-- Right Side: Guest Check-in Folio Card -->
    <rect x="345" y="142" width="145" height="168" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(245,158,11,0.2)"/>
