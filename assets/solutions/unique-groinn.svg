    <rect x="358" y="176" width="118" height="42" rx="6" fill="rgba(245,158,11,0.15)"/>
    <text x="366" y="192" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="700">Deluxe Suite #202</text>
    <text x="366" y="206" fill="#f59e0b" font-family="'Manrope', sans-serif" font-size="8">Check-in: 02:00 PM</text>

    <text x="358" y="235" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Total Bill: <tspan fill="#ffffff" font-weight="700">₹8,450</tspan></text>
    <text x="358" y="252" fill="#94a3b8" font-family="'Manrope', sans-serif" font-size="9">Dining KOT: <tspan fill="#10b981" font-weight="700">Synced</tspan></text>
    <rect x="358" y="268" width="118" height="24" rx="4" fill="#f59e0b"/>
    <text x="378" y="283" fill="#000000" font-family="'Manrope', sans-serif" font-size="9" font-weight="800">Print GST Folio</text>
  </g>
