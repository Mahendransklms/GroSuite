<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="info-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="info-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="info-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#info-grad)" opacity="0.25" filter="url(#info-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#241505" stroke="url(#info-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#info-glass)"/>
  <!-- Open Book / Knowledge Knowledge Base -->
  <path d="M18 24C22 22 28 22 32 25C36 22 42 22 46 24V42C42 40 36 40 32 43C28 40 22 40 18 42V24Z" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="25" x2="32" y2="43" stroke="#f59e0b" stroke-width="2"/>
  <!-- Data Signal / Beacon -->
  <circle cx="32" cy="17" r="2.5" fill="#f59e0b"/>
  <path d="M26 15C28 13.5 30 13 32 13C34 13 36 13.5 38 15" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
