<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="wa-api-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081827"/>
      <stop offset="50%" stop-color="#050e18"/>
      <stop offset="100%" stop-color="#02060b"/>
    </linearGradient>
    <linearGradient id="wa-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="wa-blue-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2a6df4"/>
    </linearGradient>
    <filter id="wa-drop" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#25D366" flood-opacity="0.22"/>
    </filter>
    <filter id="wa-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="120" cy="140" r="90" fill="#25D366" opacity="0.18" filter="url(#wa-glow)"/>
  <circle cx="430" cy="200" r="100" fill="#00f2fe" opacity="0.2" filter="url(#wa-glow)"/>

  <!-- Main API Gateway Console Glass Panel -->
  <g filter="url(#wa-drop)">
    <rect x="35" y="35" width="320" height="270" rx="18" fill="url(#wa-api-bg)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <rect x="35" y="35" width="320" height="270" rx="18" fill="rgba(255,255,255,0.03)"/>

    <!-- Header -->
    <path d="M35 53C35 43.0589 43.0589 35 53 35H337C346.941 35 355 43.0589 355 53V68H35V53Z" fill="rgba(255,255,255,0.04)" stroke="rgba(0,242,254,0.15)" stroke-width="1"/>
    <circle cx="56" cy="51.5" r="4.5" fill="#ef4444"/>
    <circle cx="72" cy="51.5" r="4.5" fill="#f59e0b"/>
    <circle cx="88" cy="51.5" r="4.5" fill="#25D366"/>

    <text x="110" y="55" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Webhook Router: active</text>

    <!-- Webhook Event Stream Log -->
    <g transform="translate(55, 85)">
      <!-- Event 1 -->
      <rect x="0" y="0" width="280" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(37,211,102,0.3)" stroke-width="1"/>
      <circle cx="16" cy="20" r="6" fill="#25D366"/>
      <text x="32" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">POST /webhook/whatsapp-message</text>
      <text x="32" y="32" fill="#34d399" font-family="monospace" font-size="8.5">Event: message_template_delivered (200 OK)</text>
      <text x="32" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">Latency: 14ms · Trigger: Order #9842</text>
    </g>

    <g transform="translate(55, 150)">
      <!-- Event 2 -->
      <rect x="0" y="0" width="280" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
      <circle cx="16" cy="20" r="6" fill="#00f2fe"/>
      <text x="32" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">POST /api/v2/send-notification</text>
      <text x="32" y="32" fill="#38bdf8" font-family="monospace" font-size="8.5">Payload: { recipient: "+1415...", type: "OTP" }</text>
      <text x="32" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">Queue: Redis · Dispatch: Instant</text>
    </g>

    <g transform="translate(55, 215)">
      <!-- Metrics bar -->
      <rect x="0" y="0" width="280" height="70" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(112,166,255,0.2)" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Daily Message Throughput</text>
      <text x="14" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">2,480,000</text>
      <text x="140" y="44" fill="#25D366" font-family="system-ui, sans-serif" font-size="11" font-weight="700">99.99% Delivered</text>
      <rect x="14" y="54" width="250" height="4" rx="2" fill="url(#wa-green)"/>
    </g>
  </g>

  <!-- Glowing Connecting Cables / Conduits -->
  <path d="M335 112 H370 V160 H395" stroke="url(#wa-green)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 2"/>
  <circle cx="395" cy="160" r="4.5" fill="#25D366" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Floating Smartphone Simulating WhatsApp Business -->
  <g transform="translate(390, 80)" filter="url(#wa-drop)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="130" height="230" rx="22" fill="#07151e" stroke="rgba(37,211,102,0.5)" stroke-width="1.8"/>
    <!-- Speaker notch -->
    <rect x="45" y="8" width="40" height="4" rx="2" fill="#334155"/>
    <!-- WhatsApp Screen -->
    <rect x="8" y="20" width="114" height="195" rx="16" fill="#0b1e19"/>
    <!-- WhatsApp Header -->
    <rect x="8" y="20" width="114" height="28" rx="14" fill="#128C7E"/>
    <circle cx="22" cy="34" r="7" fill="#25D366"/>
    <text x="34" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">GroSuite Store</text>
    <text x="34" y="40" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="6">Official Business</text>

    <!-- Chat Bubbles -->
    <!-- Bot Message -->
    <rect x="14" y="56" width="90" height="44" rx="8" fill="#1f2c34"/>
    <text x="20" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700">Order Confirmed! 📦</text>
    <text x="20" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="5.5">Your package is en route.</text>
    <text x="20" y="86" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="5.5">Track ID: #GS-9842</text>
    <text x="82" y="94" fill="#64748b" font-family="system-ui, sans-serif" font-size="5">10:42</text>

    <!-- Interactive Quick Reply Button -->
    <rect x="14" y="104" width="90" height="16" rx="5" fill="#25D366"/>
    <text x="32" y="115" fill="#000000" font-family="system-ui, sans-serif" font-size="6.5" font-weight="800">Track Package ↗</text>

    <!-- Customer reply -->
    <rect x="36" y="126" width="68" height="22" rx="7" fill="#005c4b"/>
    <text x="42" y="138" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="6">Thank you so much!</text>
    <text x="88" y="143" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="4.5">✓✓</text>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(18, 12)" filter="url(#wa-drop)">
    <rect x="0" y="0" width="150" height="38" rx="10" fill="#07221b" stroke="rgba(37,211,102,0.5)" stroke-width="1.2"/>
    <circle cx="18" cy="19" r="8" fill="#25D366"/>
    <path d="M15 19L17 21L21 17" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
    <text x="34" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Meta Cloud API</text>
    <text x="34" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Official BSP Partner</text>
  </g>
</svg>
