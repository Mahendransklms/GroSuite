<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="br-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00d2fe"/>
    </linearGradient>
    <linearGradient id="br-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="br-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#br-grad)" opacity="0.25" filter="url(#br-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#061e1b" stroke="url(#br-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#br-glass)"/>
  <!-- Executive Report Document -->
  <rect x="18" y="16" width="28" height="34" rx="4" stroke="#ffffff" stroke-width="2"/>
  <!-- Report Charts & Lines Inside -->
  <rect x="23" y="36" width="4" height="8" rx="1" fill="#10b981"/>
  <rect x="30" y="30" width="4" height="14" rx="1" fill="#00d2fe"/>
  <rect x="37" y="24" width="4" height="20" rx="1" fill="#ffffff"/>
  <!-- Summary Metric Line -->
  <path d="M23 23H32" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <!-- Verified Star / Accent -->
  <circle cx="48" cy="16" r="2.5" fill="#00d2fe"/>
</svg>
