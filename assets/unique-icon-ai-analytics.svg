<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ai-an-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="ai-an-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="ai-an-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#ai-an-grad)" opacity="0.25" filter="url(#ai-an-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#061e20" stroke="url(#ai-an-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#ai-an-glass)"/>
  <!-- Predictive AI Growth Chart -->
  <path d="M16 46H48" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18 42L26 34L34 38L46 22" stroke="url(#ai-an-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Predictive Dots -->
  <circle cx="26" cy="34" r="2.5" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
  <circle cx="34" cy="38" r="2.5" fill="#00d2fe" stroke="#ffffff" stroke-width="1"/>
  <circle cx="46" cy="22" r="3" fill="#ffffff" stroke="#00f2fe" stroke-width="1.5"/>
  <!-- Trend Indicator Beam -->
  <path d="M42 22H46V26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
