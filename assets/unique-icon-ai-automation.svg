<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ai-auto-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a6df4"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="ai-auto-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="ai-auto-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#ai-auto-grad)" opacity="0.25" filter="url(#ai-auto-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#081432" stroke="url(#ai-auto-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#ai-auto-glass)"/>
  <!-- AI Neural & Automation Gear Glyph -->
  <circle cx="32" cy="32" r="10" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="32" cy="32" r="4" fill="#2a6df4" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Connecting Synapse Nodes -->
  <path d="M32 16V22M32 42V48M16 32H22M42 32H48" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="16" r="2.5" fill="#00f2fe"/>
  <circle cx="32" cy="48" r="2.5" fill="#00f2fe"/>
  <circle cx="16" cy="32" r="2.5" fill="#2a6df4"/>
  <circle cx="48" cy="32" r="2.5" fill="#2a6df4"/>
  <!-- Automation Lightning -->
  <path d="M43 17L40 23H45L41 29" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
