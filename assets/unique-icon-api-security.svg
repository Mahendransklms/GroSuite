<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sec-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sec-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="sec-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#sec-grad)" opacity="0.25" filter="url(#sec-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#170c2a" stroke="url(#sec-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#sec-glass)"/>
  <!-- Security Shield & Keyhole -->
  <path d="M32 14L46 19V29C46 38.5 40 45.5 32 49C24 45.5 18 38.5 18 29V19L32 14Z" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock Core -->
  <rect x="27" y="27" width="10" height="9" rx="2" fill="#ec4899" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M29 27V23C29 21.3 30.3 20 32 20C33.7 20 35 21.3 35 23V27" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="31" r="1.2" fill="#ffffff"/>
  <circle cx="48" cy="15" r="2.5" fill="#8b5cf6"/>
</svg>
