<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ep-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ep-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="ep-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#ep-grad)" opacity="0.25" filter="url(#ep-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#1a0a10" stroke="url(#ep-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#ep-glass)"/>
  <!-- Device Screen (Laptop / Endpoint Monitor) -->
  <rect x="18" y="18" width="28" height="18" rx="2" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M15 40H49" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Shield with Checkmark inside Endpoint -->
  <path d="M32 22C32 22 37 23.5 37 26.5C37 31 32 34 32 34C32 34 27 31 27 26.5C27 23.5 32 22 32 22Z" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.4"/>
  <path d="M30 27.5L31.5 29L34.5 25.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal Radiations -->
  <circle cx="32" cy="44" r="1.5" fill="#f59e0b"/>
</svg>
