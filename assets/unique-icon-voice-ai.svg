<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voice-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="voice-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="voice-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#voice-grad)" opacity="0.25" filter="url(#voice-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#1b0e30" stroke="url(#voice-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#voice-glass)"/>
  <!-- Voice Waveform Soundbars -->
  <line x1="18" y1="28" x2="18" y2="36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="22" x2="24" y2="42" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="16" x2="30" y2="48" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="36" y1="20" x2="36" y2="44" stroke="#ec4899" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="42" y1="24" x2="42" y2="40" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="29" x2="48" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Voice Particle Sparkle -->
  <circle cx="48" cy="15" r="2.5" fill="#ec4899"/>
</svg>
