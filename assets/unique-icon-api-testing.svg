<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="test-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="test-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="test-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#test-grad)" opacity="0.25" filter="url(#test-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#061f1c" stroke="url(#test-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#test-glass)"/>
  <!-- Pulse Monitor Wave -->
  <path d="M15 33H22L26 21L32 43L37 28L40 35H49" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Health Status Indicator -->
  <circle cx="48" cy="18" r="3" fill="#10b981" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M22 47H42" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
