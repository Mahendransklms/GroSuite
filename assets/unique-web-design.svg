<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="wd-bg" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1332"/>
      <stop offset="50%" stop-color="#070c20"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>
    <linearGradient id="wd-cyan-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a6df4"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="wd-purple-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="wd-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="wd-shadow" x="-20" y="-20" width="580" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#2a6df4" flood-opacity="0.25"/>
    </filter>
    <filter id="wd-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glows -->
  <circle cx="120" cy="110" r="90" fill="#2a6df4" opacity="0.22" filter="url(#wd-glow)"/>
  <circle cx="420" cy="260" r="100" fill="#8a2be2" opacity="0.18" filter="url(#wd-glow)"/>
  <circle cx="280" cy="30" r="70" fill="#00f2fe" opacity="0.15" filter="url(#wd-glow)"/>

  <!-- Main Floating Glass Browser Canvas -->
  <g filter="url(#wd-shadow)">
    <!-- Browser Container -->
    <rect x="40" y="35" width="410" height="265" rx="18" fill="url(#wd-bg)" stroke="rgba(112, 166, 255, 0.35)" stroke-width="1.5"/>
    <rect x="40" y="35" width="410" height="265" rx="18" fill="url(#wd-glass)"/>

    <!-- Browser Window Top Header Bar -->
    <path d="M40 53C40 43.0589 48.0589 35 58 35H432C441.941 35 450 43.0589 450 53V68H40V53Z" fill="rgba(255,255,255,0.04)" stroke="rgba(112,166,255,0.15)" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="62" cy="51" r="4.5" fill="#ef4444"/>
    <circle cx="78" cy="51" r="4.5" fill="#f59e0b"/>
    <circle cx="94" cy="51" r="4.5" fill="#10b981"/>

    <!-- URL Pill -->
    <rect x="120" y="44" width="220" height="15" rx="7.5" fill="rgba(255,255,255,0.06)" stroke="rgba(112,166,255,0.2)" stroke-width="0.8"/>
    <circle cx="132" cy="51.5" r="2.5" fill="#00f2fe"/>
    <rect x="142" y="49" width="110" height="5" rx="2.5" fill="#94a3b8" opacity="0.7"/>

    <!-- Website Hero Simulation Inside Browser -->
    <rect x="65" y="88" width="160" height="12" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="65" y="108" width="130" height="8" rx="3" fill="url(#wd-cyan-blue)"/>
    <rect x="65" y="126" width="180" height="5" rx="2.5" fill="#64748b" opacity="0.8"/>
    <rect x="65" y="136" width="150" height="5" rx="2.5" fill="#64748b" opacity="0.6"/>

    <!-- CTA Button Mockup -->
    <rect x="65" y="154" width="70" height="20" rx="6" fill="url(#wd-cyan-blue)"/>
    <rect x="77" y="161" width="46" height="5" rx="2.5" fill="#ffffff"/>

    <rect x="145" y="154" width="60" height="20" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="157" y="161" width="36" height="5" rx="2.5" fill="#cbd5e1"/>

    <!-- Grid Feature Cards Mockups inside browser -->
    <rect x="65" y="190" width="85" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(112,166,255,0.2)" stroke-width="1"/>
    <circle cx="85" cy="210" r="9" fill="rgba(42,109,244,0.3)"/>
    <rect x="75" y="228" width="65" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="75" y="238" width="50" height="4" rx="2" fill="#64748b"/>

    <rect x="160" y="190" width="85" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(112,166,255,0.2)" stroke-width="1"/>
    <circle cx="180" cy="210" r="9" fill="rgba(138,43,226,0.3)"/>
    <rect x="170" y="228" width="65" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="170" y="238" width="50" height="4" rx="2" fill="#64748b"/>

    <!-- Floating Graphic Visual On The Right Side Of Browser -->
    <g transform="translate(265, 88)">
      <rect x="0" y="0" width="160" height="145" rx="12" fill="rgba(9,19,48,0.85)" stroke="rgba(112,166,255,0.3)" stroke-width="1"/>
      <!-- Wave / Graphic Line -->
      <path d="M15 110C40 85 65 125 90 95C115 65 130 90 145 75" stroke="url(#wd-cyan-blue)" stroke-width="3" stroke-linecap="round"/>
      <path d="M15 110C40 85 65 125 90 95C115 65 130 90 145 75V135H15V110Z" fill="url(#wd-cyan-blue)" opacity="0.12"/>
      <circle cx="90" cy="95" r="4.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="145" cy="75" r="4.5" fill="#2a6df4" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Floating Mobile Device Mockup (Overlapping for Responsive Context) -->
  <g transform="translate(365, 140)" filter="url(#wd-shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="130" height="210" rx="24" fill="#050a1a" stroke="rgba(0, 242, 254, 0.45)" stroke-width="1.8"/>
    <!-- Phone Speaker Notch -->
    <rect x="45" y="8" width="40" height="4" rx="2" fill="#334155"/>
    <!-- Screen Content -->
    <rect x="8" y="20" width="114" height="175" rx="16" fill="rgba(15, 23, 42, 0.95)"/>
    <!-- Mobile Header -->
    <rect x="18" y="32" width="40" height="6" rx="2" fill="#ffffff"/>
    <circle cx="110" cy="35" r="3" fill="#00f2fe"/>
    <!-- Mobile Card 1 -->
    <rect x="16" y="48" width="98" height="48" rx="8" fill="rgba(42,109,244,0.18)" stroke="rgba(112,166,255,0.3)" stroke-width="1"/>
    <rect x="24" y="58" width="55" height="5" rx="2" fill="#ffffff"/>
    <rect x="24" y="68" width="75" height="4" rx="2" fill="#94a3b8"/>
    <rect x="24" y="76" width="35" height="12" rx="4" fill="url(#wd-cyan-blue)"/>
    <!-- Mobile Card 2 -->
    <rect x="16" y="104" width="98" height="55" rx="8" fill="rgba(138,43,226,0.15)" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
    <circle cx="28" cy="120" r="6" fill="#ec4899"/>
    <rect x="40" y="118" width="60" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="40" y="126" width="45" height="3" rx="1.5" fill="#64748b"/>
    <!-- Home Bar Indicator -->
    <rect x="45" y="200" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Floating Floating Tech Badges (Design Tokens & Speed) -->
  <g transform="translate(18, 185)" filter="url(#wd-shadow)">
    <rect x="0" y="0" width="135" height="42" rx="12" fill="#07112c" stroke="rgba(112,166,255,0.4)" stroke-width="1.2"/>
    <circle cx="22" cy="21" r="11" fill="rgba(0,242,254,0.18)"/>
    <path d="M22 14L25 19H19L22 14Z" fill="#00f2fe"/>
    <path d="M22 28L19 23H25L22 28Z" fill="#00f2fe"/>
    <text x="42" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">99.8% Score</text>
    <text x="42" y="30" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Core Web Vitals</text>
  </g>

  <g transform="translate(245, 12)" filter="url(#wd-shadow)">
    <rect x="0" y="0" width="145" height="38" rx="10" fill="#0f0c2a" stroke="rgba(236,72,153,0.45)" stroke-width="1.2"/>
    <circle cx="18" cy="19" r="8" fill="#ec4899"/>
    <path d="M15 19L17 21L21 17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="34" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Figma to React</text>
    <text x="34" y="28" fill="#ec4899" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Pixel-Perfect UI</text>
  </g>
</svg>
