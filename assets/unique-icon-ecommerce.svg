<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ecom-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ecom-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="ecom-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#ecom-grad)" opacity="0.25" filter="url(#ecom-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#072227" stroke="url(#ecom-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#ecom-glass)"/>
  <!-- Shopping Cart & Digital Lightning / Bag -->
  <path d="M16 20H22L26 38H42L46 24H24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="44" r="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="40" cy="44" r="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Digital Tag / Gem -->
  <path d="M34 16L39 21L34 26L29 21Z" fill="#10b981" opacity="0.8"/>
  <circle cx="48" cy="14" r="2" fill="#34d399"/>
</svg>
