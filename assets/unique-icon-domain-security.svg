<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ds-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ds-glass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="ds-glow" x="-10" y="-10" width="84" height="84" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#ds-grad)" opacity="0.25" filter="url(#ds-glow)"/>
  <!-- Base Glass Card -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#061e22" stroke="url(#ds-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#ds-glass)"/>
  <!-- Global Domain Sphere with Latitude/Longitude -->
  <circle cx="32" cy="30" r="13" stroke="#ffffff" stroke-width="1.8"/>
  <ellipse cx="32" cy="30" rx="6" ry="13" stroke="#00d2fe" stroke-width="1.3"/>
  <path d="M19 30H45" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- DNS Shield with Lock at bottom right -->
  <path d="M37 38C37 38 42 39.5 42 42C42 46 37 49 37 49C37 49 32 46 32 42C32 39.5 37 38 37 38Z" fill="#10b981" fill-opacity="0.4" stroke="#10b981" stroke-width="1.4"/>
  <circle cx="37" cy="43.5" r="1.5" fill="#ffffff"/>
</svg>
